[gcode_macro UPDATE_HOTKEY_STATE]
description: Update B1/B2 LEDs from actual QGL and homing state
gcode:
    # B1 - QGL status
    {% if printer.quad_gantry_level.applied %}
        _SET_HOTKEY_LED_B1 RED=0 GREEN=0.1 BLUE=0
    {% else %}
        _SET_HOTKEY_LED_B1 RED=0.1 GREEN=0 BLUE=0
    {% endif %}

    # B2 - Homing status
    {% if "xyz" in printer.toolhead.homed_axes %}
        _SET_HOTKEY_LED_B2 RED=0 GREEN=0.1 BLUE=0
    {% else %}
        _SET_HOTKEY_LED_B2 RED=0.1 GREEN=0 BLUE=0
    {% endif %}


[gcode_macro _status_button_busy]
gcode:
  {% set button = params.BUTTON %}
    _set_hotkey_leds_by_name leds="b{button}" color="busy" transmit=1


[gcode_macro _status_button_ready]
gcode:
  {% set button = params.BUTTON %}
    _set_hotkey_leds_by_name leds="b{button}" color="ready" transmit=1


[gcode_macro LOAD_FILAMENT]
description: Heat to filament-change temperature, load filament, then restore the previous hotend target
gcode:
    {% set change_temp = params.TEMP|default(250)|int %}
    {% set previous_target = printer.extruder.target|float %}

    # Keep the nozzle area illuminated throughout the filament change.
    set_nozzle_leds_on

    # Red logo and LCD message mean we are waiting for filament-change temperature.
    SET_LED LED=sb_leds INDEX=1 RED=1 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1
    M117 load-heating
    M109 S{change_temp}

    # Bright green logo and LCD message mean the extruder is about to move filament.
    SET_LED LED=sb_leds INDEX=1 RED=0 GREEN=1 BLUE=0 WHITE=0 TRANSMIT=1
    M117 load filament moving
    M300 S1000 P100

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    M83

    # Feed through the long path in chunks so each move stays below
    # Klipper's default max_extrude_only_distance safety limit.
    G1 E40 F1200
    G1 E40 F1200

    # Slow down as the filament reaches the extruder gears and hotend.
    G1 E25 F600
    G1 E15 F180

    # Purge enough to confirm material is flowing from the nozzle.
    G1 E10 F120

    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

    # Restore whatever hotend target existed before the filament change.
    M104 S{previous_target}
    M300 S1000 P100
    G4 P100
    M300 S1000 P100
    M117 load complete

[gcode_macro UNLOAD_FILAMENT]
description: Heat to filament-change temperature, unload filament, then restore the previous hotend target
gcode:
    {% set change_temp = params.TEMP|default(250)|int %}
    {% set previous_target = printer.extruder.target|float %}

    # Keep the nozzle area illuminated throughout the filament change.
    set_nozzle_leds_on

    # Red logo and LCD message mean we are waiting for filament-change temperature.
    SET_LED LED=sb_leds INDEX=1 RED=1 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1
    M117 unload-heating
    M109 S{change_temp}

    # Yellow logo and LCD message mean the extruder is about to move filament.
    SET_LED LED=sb_leds INDEX=1 RED=1 GREEN=1 BLUE=0 WHITE=0 TRANSMIT=1
    M117 unload-filament moving
    M300 S1000 P100

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    M83

    # Snap the first 10 mm out of the melt zone quickly to reduce stringing.
    G1 E-10 F3000

    # Continue retracting in safe chunks until the filament is clear
    # of the extruder gears and can be removed from the remote feed path.
    G1 E-40 F1200
    G1 E-40 F1200
    G1 E-30 F1200

    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

    # Restore whatever hotend target existed before the filament change.
    M104 S{previous_target}
    M300 S1000 P100
    G4 P100
    M300 S1000 P100
    M117 unload complete
