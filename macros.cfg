#####################################################################
# Nozzle Maintenance and Priming
#####################################################################

[gcode_macro WIPE_NOZZLE]
description: Wipe nozzle across the fixed rear brush
gcode:
    M117 Wiping Nozzle
    SAVE_GCODE_STATE NAME=WIPE_NOZZLE_STATE
    STATUS_CLEANING
    SET_LED LED=chamber RED=0 GREEN=1 BLUE=0 TRANSMIT=1

    # Use absolute coordinates so the wipe does not depend on where the toolhead started.
    G90

    # Approach the brush from above, then lower to the measured wipe height.
    G0 X111 Y298 Z5 F12000
    G0 Z0.8 F1200

    # Sweep across the brush while using most of its Y width.
    G0 X91 Y296 F9000
    G0 X131 Y300 F9000
    G0 X91 Y300 F9000
    G0 X131 Y296 F9000
    G0 X91 Y298 F9000
    G0 X131 Y298 F9000

    # Lift clear before restoring the caller's previous coordinate state.
    G0 Z5 F1200

    SET_LED LED=chamber RED=1 GREEN=1 BLUE=1 TRANSMIT=1
    RESTORE_GCODE_STATE NAME=WIPE_NOZZLE_STATE

[gcode_macro PRIME_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
    STATUS_BUSY
    SET_LED LED=chamber RED=0 GREEN=1 BLUE=1  TRANSMIT=1
    M117 Priming
    G90                 ; Absolute coordinates.
    M83                 ; Relative extruder mode.
    G92 E0
    ; Move to start of line.
    G1 Z10 F900
    G1 Y3 X3 F18000
    G1 Z0.2 F900
    ; Print the line.
    G91                ; Relative coordinates.
    G1 X100 E25 F1000  ; Lay down the first section of the prime line.
    G1 Y-2 F1000
    G1 X-60 E9 F1000    ; Print second part of the line.
    G1 E-0.5 F3000      ; Retract to avoid stringing.
    G1 X0.5 E0 F1000    ; Wipe back to break string.
    G1 X-5.5 E0 F1000   ; Wipe forward to break string.
    SET_LED LED=chamber RED=1 GREEN=1 BLUE=1  TRANSMIT=1
    RESTORE_GCODE_STATE NAME=PRIME_NOZZLE_STATE


