    SET_LED LED=sb_leds INDEX=1 RED=1 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=0
    SET_LED LED=sb_leds INDEX=2 RED=0.8 GREEN=0.8 BLUE=0.8 WHITE=1 TRANSMIT=0
    SET_LED LED=sb_leds INDEX=3 RED=0.8 GREEN=0.8 BLUE=0.8 WHITE=1


#####################################################################
# Sound
#####################################################################

[gcode_macro M300]
gcode:  
  {% set S = params.S|default(1000)|int %} ; S sets the tone frequency
  {% set P = params.P|default(100)|int %} ; P sets the tone duration
  {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
  {% if S <= 0 %} ; dont divide through zero
  {% set F = 1 %}
  {% set L = 0 %}
  {% elif S >= 10000 %} ;max frequency set to 10kHz
  {% set F = 0 %}
  {% else %}
  {% set F = 1/S %} ;convert frequency to seconds 
  {% endif %}
    SET_PIN PIN=beeper VALUE={L} CYCLE_TIME={F} ;Play tone
  G4 P{P} ;tone duration
    SET_PIN PIN=beeper VALUE=0


[gcode_macro PLAY_MARIO]
gcode:
    M300 P153 S659
    M300 P149 S659
    M300 P148 S0
    M300 P148 S659
    M300 P154 S0
    M300 P149 S523
    M300 P148 S659
    M300 P149 S0
    M300 P154 S784
    M300 P446 S0
    M300 P154 S392


#####################################################################
# Input Shaper / Resonance Testing
#####################################################################

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Run automatic X and Y input shaper calibration and save the results
gcode:
    # Resonance calibration should be done with the printer mechanically quiet.
    # Keep the heaters and part-cooling fan off so they do not add vibration to the test.
    TURN_OFF_HEATERS
    M107

    # Resonance testing requires known coordinates. The configured resonance_tester
    # probe point controls where Klipper moves the toolhead for the actual tests.
    G28

    SET_LED LED=chamber RED=0.2 GREEN=0.2 BLUE=1 TRANSMIT=1
    M117 Input shaper - X axis
    SHAPER_CALIBRATE AXIS=X

    M117 Input shaper - Y axis
    SHAPER_CALIBRATE AXIS=Y

    # SHAPER_CALIBRATE applies the selected values in memory. SAVE_CONFIG writes
    # them into Klipper's SAVE_CONFIG block and restarts Klipper, so this is last.
    M117 Input shaper complete - saving
    M300 S1200 P150
    G4 P100
    M300 S1600 P150
    SET_LED LED=chamber RED=0 GREEN=1 BLUE=0 TRANSMIT=1
    SAVE_CONFIG

[gcode_macro TEST_RESONANCES_ALL]
description: Run raw X and Y resonance tests without changing input shaper settings
gcode:
    # This diagnostic test produces Klipper resonance data but does not select or
    # save new input shaper values. Use it when comparing the machine mechanically.
    TURN_OFF_HEATERS
    M107
    G28

    SET_LED LED=chamber RED=0.2 GREEN=0.2 BLUE=1 TRANSMIT=1
    M117 Resonance test - X axis
    TEST_RESONANCES AXIS=X

    M117 Resonance test - Y axis
    TEST_RESONANCES AXIS=Y

    M117 Resonance tests complete
    M300 S1200 P150
    G4 P100
    M300 S1600 P150
    SET_LED LED=chamber RED=1 GREEN=1 BLUE=1 TRANSMIT=1

