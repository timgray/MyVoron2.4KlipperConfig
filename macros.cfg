#####################################################################
# Macros
# Central location for printer behavior macros and front-panel helpers.
#####################################################################

#####################################################################
# Print Lifecycle
#####################################################################

[gcode_macro PRINT_START]
description: Cold level if needed, heat, final hot wipe, re-home Z, load mesh, and start print
gcode:
    {% set extruder_temp = params.EXTRUDER|default(250)|int %}
    {% set bed_temp = params.BED|default(110)|int %}
    {% set standby_temp = 150 %}

    # Keep the motion encoder disabled through startup and the purge. The BTT SFS V2.0
    # reports motion in roughly 2.88 mm increments, so starting its accounting during
    # setup extrusion can produce a false runout before the first useful transition.
    # The separate filament switch remains active and can still detect missing filament.
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

    STATUS_PRINTING
    SET_LED LED=chamber RED=0.5 GREEN=1 BLUE=0 TRANSMIT=1
    SKEW_PROFILE LOAD=TimSkew

    # Keep both heaters off while establishing the initial machine geometry.
    # This gives the inductive probe a repeatable condition during QGL.
    M104 S0
    M140 S0

    G32

    # Once homing and any required QGL are complete, begin the actual warmup.
    # Hold the nozzle at a low standby temperature while the bed reaches the
    # slicer's requested first-layer temperature.
    M117 Heating bed
    M140 S{bed_temp}
    M104 S{standby_temp}
    M190 S{bed_temp}

    # Bring the nozzle to the slicer's requested first-layer temperature only
    # after the bed is ready. The final wipe removes any ooze produced here.
    M117 Heating nozzle
    M109 S{extruder_temp}

    # Establish the final Z reference with the nozzle hot and clean. QGL is not
    # repeated here because it was established with the inductive probe cold.
    M117 Final nozzle wipe
    WIPE_NOZZLE
    G28 Z

    BED_MESH_PROFILE LOAD=default

    G90
    G1 Z20 F3000
    SET_FAN_SPEED FAN=Nevermore SPEED=1.0
    SET_LED LED=chamber RED=0 GREEN=1 BLUE=0 TRANSMIT=1
    PRIME_NOZZLE

    # Startup extrusion is complete. Enable motion monitoring immediately before the
    # slicer begins the print so the encoder starts from a clean extrusion state.
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    SET_LED LED=chamber RED=1 GREEN=1 BLUE=1 TRANSMIT=1
    M117 Printing

# Slicer ending G-code should call PRINT_END.

[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    SET_LED LED=chamber RED=0 GREEN=1 BLUE=0  TRANSMIT=1
    SET_NOZZLE_LEDS_OFF
    SET_LED LED=sb_leds INDEX=1 RED=0 GREEN=0.5 BLUE=0 WHITE=0 TRANSMIT=1
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    M84                                      ; disable the servos to save them from burning up
    PLAY_MARIO
    UPDATE_HOTKEY_STATE
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=60   ;Shutdown nevermore after 60 seconds
    SET_LED LED=chamber RED=0.5 GREEN=0.5 BLUE=0.5  TRANSMIT=1
    SET_SKEW CLEAR=1

#####################################################################
# Homing and Parking
#####################################################################

[gcode_macro G32]
description: Home, clean nozzle, re-home Z, and level gantry if needed
gcode:
    SET_LED LED=chamber RED=0.2 GREEN=1 BLUE=0.2 TRANSMIT=1
    SAVE_GCODE_STATE NAME=STATE_G32
    G90

    # Establish a known machine position first.
    G28

    # Clean the nozzle before establishing the final Z reference.
    WIPE_NOZZLE

    # Re-home Z with a clean nozzle so plastic on the nozzle cannot affect Z homing.
    G28 Z

    # Turn on the nozzle LEDs before checking or performing QGL.
    set_nozzle_leds_on

    # Only run QGL if it has not already completed successfully.
    {% if not printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL
    {% else %}
        M117 QGL already applied - skipping
    {% endif %}

    RESTORE_GCODE_STATE NAME=STATE_G32
    SET_LED LED=chamber RED=1 GREEN=1 BLUE=1 TRANSMIT=1
    UPDATE_HOTKEY_STATE


# Slicer starting G-code should call PRINT_START with EXTRUDER and BED temperatures.


[gcode_macro SERVICE_PRINTHEAD]
description: Level and move the printhead to a well-lit front service position
gcode:
    {% set th = printer.toolhead %}
    G32
    G90
    G0 Z150 F3000
    G0 X{th.axis_maximum.x / 2} Y5 F12000
    set_nozzle_leds_on


#####################################################################
# Bed Mesh
#####################################################################

[gcode_macro BED_MESH_CALIBRATE_SAVE]
description: Home, level gantry, create default bed mesh, and save it
gcode:
    G32
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE=default
    SAVE_CONFIG


[gcode_macro _MESH_PROBE_HEATER_STATE]
variable_enabled: 0
variable_target: 0
gcode:
    # State holder used by the probe callbacks during temperature mesh calibration.

[gcode_macro BED_MESH_CALIBRATE_TEMP]
description: Cold home/QGL, optionally heat soak the bed, then probe with heater gated off for each sample
gcode:
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    {% set soak = params.SOAK|default(10)|int %}
    {% if bed_temp > 0 %}
        {% set profile = params.PROFILE|default("TEMP_" ~ bed_temp) %}
    {% else %}
        {% set profile = params.PROFILE|default("default") %}
    {% endif %}

    # Establish machine geometry cold. Do not run QGL while either heater is on.
    SET_GCODE_VARIABLE MACRO=_MESH_PROBE_HEATER_STATE VARIABLE=enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_MESH_PROBE_HEATER_STATE VARIABLE=target VALUE=0
    M104 S0
    M140 S0
    G32

    # Heat and soak only after cold homing/QGL is complete.
    {% if bed_temp > 0 %}
        M117 mesh heating {bed_temp}C
        M140 S{bed_temp}
        M190 S{bed_temp}

        {% if soak > 0 %}
            M117 mesh soaking {soak} min
            G4 P{soak * 60000}
        {% endif %}

        # During mesh probing, [probe] activate_gcode turns the bed heater off
        # for each individual sample, waits 500 ms, then deactivate_gcode
        # restores this target immediately after that sample.
        SET_GCODE_VARIABLE MACRO=_MESH_PROBE_HEATER_STATE VARIABLE=target VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_MESH_PROBE_HEATER_STATE VARIABLE=enabled VALUE=1
    {% endif %}

    BED_MESH_CLEAR
    M117 probing {profile}
    BED_MESH_CALIBRATE PROFILE={profile}

    # Return probe callbacks to normal behavior after calibration.
    SET_GCODE_VARIABLE MACRO=_MESH_PROBE_HEATER_STATE VARIABLE=enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_MESH_PROBE_HEATER_STATE VARIABLE=target VALUE=0

    M117 saving {profile}
    SAVE_CONFIG

[gcode_macro BED_MESH_LOAD]
description: Load the saved default bed mesh
gcode:
    BED_MESH_PROFILE LOAD=default


#####################################################################
#   Nevermore Control
#####################################################################

#####################################################################
# Pause, Resume, and Cancel
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0                                    ; disable filament switch during pause
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0                                   ; disable filament motion sensor during pause
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S{printer['extruder'].target}                                                   ; explicitly hold the current print temperature during pause
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
        _SET_HOTKEY_LED_B5 RED=0.1 GREEN=0.1 BLUE=0                                           ; yellow while paused
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1                            ; re-enable filament switch
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1                           ; re-enable filament motion sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                     ; resume print
        _SET_HOTKEY_LED_B5 RED=0.1 GREEN=0 BLUE=0                                 ; return pause button to base red
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the active print and perform safe abort cleanup
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set th = printer.toolhead %}
    {% set xyz_homed = "xyz" in th.homed_axes %}
    {% set hotend_ready = printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    M400

    {% if hotend_ready %}
        M83
        G1 E-5.0 F1800
    {% endif %}

    TURN_OFF_HEATERS
    M107

    {% if xyz_homed %}
        G90
        G0 Z{z_safe} F3000
        G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F12000
    {% endif %}

    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    SET_NOZZLE_LEDS_OFF
    SET_LED LED=sb_leds INDEX=1 RED=0.5 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1
    SET_LED LED=chamber RED=0.5 GREEN=0.5 BLUE=0.5 TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=60
    BASE_CANCEL_PRINT

[pause_resume]

[gcode_macro M0]
gcode:
  PAUSE

[menu __main __pause]
type: command
enable: {printer.idle_timeout.state == "Printing"}
name: Pause Printing
gcode:
  PAUSE

[menu __main __resume]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Resume Printing
gcode:
  RESUME


